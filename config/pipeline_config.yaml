# Tunable knobs, loaded by pipeline/config.py. Every consumer falls back to the same default it
# would use if this file didn't exist -- edit here to change behavior without touching code.

retry_budget_per_gate: 2

microcopy_caps:
  title: 3
  subtitle: 3
  hook: 5
  cta: 5

transport:
  default: cli   # cli | sdk | off -- overridden at runtime by CONTENT_JUDGE_TRANSPORT

# How far outside a brief's word range a body may land before style_lint fails it, as a fraction
# of the bound (0.1 = 10% under min or over max). Writers miss exact counts; this keeps a 1,190-word
# draft in a 1,200-2,000 range from costing a whole revision round.
word_range_tolerance: 0.1

# How much client context (strategy, past content, notes) a prompt may carry, in characters.
context_budget_chars: 14000

# Per content type: which micro-copy fields the menu offers (field -> candidate count) and the
# default word range [min, max] the UI pre-fills. A format not listed here falls back to
# microcopy_caps above (title/subtitle/hook/cta).
formats:
  email:
    word_range: [100, 200]
    microcopy: {subject_line: 5, preheader: 3, cta: 3}
  linkedin_message:
    word_range: [60, 120]
    microcopy: {opener: 3, cta: 3}
  social_post:
    word_range: [50, 150]
    microcopy: {hook: 5, cta: 3}
  blog_post:
    word_range: [1200, 2000]
    microcopy: {title: 3, subtitle: 3, hook: 5, cta: 5}
  landing_page:
    word_range: [300, 600]
    microcopy: {headline: 3, subheadline: 3, cta: 5}
